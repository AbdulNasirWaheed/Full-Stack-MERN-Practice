<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading Progress Bar</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #f5f5f5;
  font-family: Arial, sans-serif;
}

.wrapper {
  width: 80%;
  max-width: 600px;
  text-align: center;
}

h2 {
  color: #333;
  margin-bottom: 20px;
}

.progress-container {
  width: 100%;
  height: 30px;
  background-color: #ddd;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4CAF50, #81C784);
  border-radius: 15px;
  animation: load 3s ease-in-out infinite;
}

@keyframes load {
  0% {
    width: 0%;
  }
  100% {
    width: 100%;
  }
}
</style>
</head>
<body>
  <div class="wrapper">
    <h2>Loading...</h2>
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>
