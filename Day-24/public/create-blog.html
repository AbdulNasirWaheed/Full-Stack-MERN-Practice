<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; }
        input[type="text"], textarea { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        textarea { min-height: 100px; }
        input[type="file"] { padding: 8px; }
        button { padding: 10px; font-size: 16px; background: #2274a5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #message { margin-top: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Create Blog Post</h1>
    <form id="blogForm" enctype="multipart/form-data">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" required></textarea>

        <label for="thumbnail">Thumbnail</label>
        <input type="file" id="thumbnail" name="thumbnail" accept="image/jpeg,image/png,image/gif">

        <button type="submit">Create Blog</button>
    </form>
    <div id="message"></div>

    <script>
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const msg = document.getElementById('message');
            try {
                const res = await fetch('/create-blog', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    msg.style.color = 'green';
                    form.reset();
                } else {
                    msg.style.color = 'red';
                }
                msg.textContent = data.message;
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'Something went wrong, please try again.';
            }
        });
    </script>
</body>
</html>
