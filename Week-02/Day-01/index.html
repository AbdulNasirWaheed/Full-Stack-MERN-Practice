<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        #hero{
            width: 100vw;
            height: 100vh;
            background-image: url(https://images.pexels.com/photos/291732/pexels-photo-291732.jpeg);
            background-size: cover;
            background-position: center;
        }

        section h1{
            color: white;
            font-size: 5.5rem;
            padding-left: 50px;
            padding-top: 30vh;
            font-family: sans-serif;
        }

        button{
            background-color: #0077cc;
            padding: 12px 24px;
            margin-left: 50px;
            margin-top: 20px;
            color: white;
            font-size: 1.1rem;
            font-family: sans-serif;
            border: 2px solid #ffffff;
            border-radius: 8px;
        }

    </style>
    <title>Explore Northern Pakistan</title>
</head>
<body>

<section id="hero">
    <h1>Explore<br/>Northern Pakistan</h1>
    <button>Explore Now <i class="ri-arrow-right-line"></i></button>
</section>        

</body>
</html>
